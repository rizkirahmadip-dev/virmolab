name: VirmoLab CI

on:
  push:
    branches: [ main, master, dev* ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Sintaksis
    runs-on: windows-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Pasang Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Pasang perkakas linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes ruff

      - name: Jalankan Pyflakes
        run: |
          python -m pyflakes virmolab

      - name: Jalankan Ruff Linter
        run: |
          python -m ruff check virmolab

  # Uji mandiri 64 butir TIDAK dijalankan di sini. Butir-butirnya memerlukan mesin docking terbundel
  # di vendor/bin serta belasan paket ilmiah (scipy, scikit-learn, gemmi, meeko, PoseBusters, OpenMM,
  # ADMET-AI, CReM, pymbar); sebagian tidak ada di PyPI dan seluruhnya berukuran beberapa gigabita,
  # sehingga pelari CI tidak bisa menirukan lingkungannya. Gerbang sesungguhnya tetap ada dan wajib
  # dilewati: build_tools/rilis.py menjalankan seluruh 64 butir pada aplikasi yang sudah dibangun dan
  # menghentikan rilis bila satu saja gagal.
  #
  # Yang diperiksa di sini adalah hal yang memang bisa diperiksa tanpa lingkungan itu: seluruh berkas
  # dapat diurai oleh versi Python yang didukung, dan modul inti yang bebas Qt benar-benar dapat diimpor.
  sintaksis:
    name: Sintaksis & Impor Modul Inti
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Pasang Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang dependensi ringan
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy networkx

      - name: Periksa sintaksis seluruh paket
        run: |
          python -m compileall -q virmolab

      - name: Periksa modul inti dapat diimpor
        run: |
          python -c "from virmolab.core import venn, pengayaan, jaringan, graf, grafik, uji, sumber_data, ctd, farmakologi, figur_jaringan, laporan_jaringan; print('impor modul inti OK')"

      - name: Periksa nomor versi terbaca
        run: |
          python -c "import virmolab; print('VirmoLab', virmolab.__version__)"

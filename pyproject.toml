[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virmolab"
dynamic = ["version"]          # dibaca dari virmolab/__init__.py, satu-satunya sumber nomor versi
description = "Aplikasi desktop molecular docking untuk penemuan obat dan penelitian kimia komputasi"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "apt. Rizki Rahmadi Pratama, M. Farm" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
include = ["virmolab*"]       # akar repo juga memuat dev/, vendor/, installer/, dll. yang bukan bagian paket

[tool.setuptools.dynamic]
version = {attr = "virmolab.__version__"}

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pemodernan gaya (anotasi PEP 585/604 lewat "UP" dan pengurutan impor lewat "I") menandai 1.061 hal
# di hampir seluruh berkas. Itu pekerjaan tersendiri, bukan sesuatu yang pantas disisipkan ke dalam
# perubahan fitur, jadi gerbang CI untuk sementara memeriksa kebenaran saja.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501", # baris panjang (lebar kode proyek ini 120+, diperiksa saat tinjauan)
    "E722", # except telanjang (dipakai sengaja; diperiksa satu per satu)
    "F403", # import *
    "E741", # nama variabel 'l' dipakai konsisten untuk QLabel di seluruh lapisan UI
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"dev/*" = ["F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["dev"]
python_files = ["uji_*.py"]
python_functions = ["uji_*", "test_*"]
